<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Winterdeveloper — oyunlar, Android uygulamaları, Windows araçları ve web projeleri">
<defs>
  <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03050c"/>
    <stop offset=".55" stop-color="#070d20"/>
    <stop offset="1" stop-color="#0b1431"/>
  </linearGradient>
  <linearGradient id="baslik" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e9f6ff"/>
    <stop offset=".45" stop-color="#5fe1ff"/>
    <stop offset="1" stop-color="#b57bff"/>
  </linearGradient>
  <linearGradient id="cizgi" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00d4ff"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tarama" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00d4ff" stop-opacity=".10"/>
    <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="izgaraSol" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
    <stop offset="1" stop-color="#00d4ff" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d1530" stop-opacity=".92"/>
    <stop offset="1" stop-color="#070c1c" stop-opacity=".92"/>
  </linearGradient>
  <linearGradient id="panelKenar" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00d4ff" stop-opacity=".7"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity=".7"/>
  </linearGradient>
  <filter id="bulanik" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="parilti" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="kirp"><rect width="1200" height="380" rx="18"/></clipPath>
  <pattern id="nokta" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#5fe1ff" opacity=".10"/></pattern>
</defs>
<style>
  .sans{font-family:'Segoe UI',Inter,-apple-system,system-ui,Roboto,Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'SF Mono',Menlo,'Courier New',monospace}
  .kure{animation:nefes 7s ease-in-out infinite}
  .kure2{animation:nefes 9s ease-in-out infinite reverse}
  @keyframes nefes{0%,100%{opacity:.55}50%{opacity:.95}}
  .tara{animation:tara 6s linear infinite}
  @keyframes tara{from{transform:translateX(-400px)}to{transform:translateX(1300px)}}
  .imlec{animation:yanip 1.05s steps(1) infinite}
  @keyframes yanip{50%{opacity:0}}
  .gir{opacity:0;animation:gir .9s ease-out forwards}
  @keyframes gir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .zerre{animation:yuksel linear infinite}
  @keyframes yuksel{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-260px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.kure,.kure2,.tara,.imlec,.zerre{animation:none}.gir{animation:none;opacity:1}}
</style>

<g clip-path="url(#kirp)">
  <rect width="1200" height="380" fill="url(#zemin)"/>
  <rect width="1200" height="380" fill="url(#nokta)"/>

  <!-- ışık küreleri -->
  <circle class="kure" cx="180" cy="90" r="170" fill="#00b8ff" opacity=".7" filter="url(#bulanik)"/>
  <circle class="kure2" cx="1040" cy="300" r="190" fill="#8b3dff" opacity=".7" filter="url(#bulanik)"/>
  <circle class="kure" cx="760" cy="-20" r="120" fill="#4f46e5" opacity=".5" filter="url(#bulanik)"/>

  <!-- perspektif ızgara -->
  <g stroke="url(#izgaraSol)" stroke-width="1" fill="none" opacity=".9">
    <path d="M600 250 L-300 380 M600 250 L-60 380 M600 250 L180 380 M600 250 L420 380 M600 250 L600 380 M600 250 L780 380 M600 250 L1020 380 M600 250 L1260 380 M600 250 L1500 380"/>
    <path d="M0 262 H1200 M0 278 H1200 M0 300 H1200 M0 330 H1200 M0 372 H1200" stroke="#00d4ff" stroke-opacity=".14"/>
  </g>
  <rect x="0" y="250" width="1200" height="1" fill="url(#cizgi)" opacity=".8"/>

  <!-- yükselen zerreler -->
  <g fill="#5fe1ff">
    <circle class="zerre" cx="90"  cy="370" r="1.6" style="animation-duration:9s;animation-delay:-1s"/>
    <circle class="zerre" cx="260" cy="370" r="1.2" style="animation-duration:11s;animation-delay:-6s"/>
    <circle class="zerre" cx="410" cy="370" r="1.8" style="animation-duration:8s;animation-delay:-3s"/>
    <circle class="zerre" cx="555" cy="370" r="1.2" style="animation-duration:12s;animation-delay:-8s"/>
    <circle class="zerre" cx="700" cy="370" r="1.5" style="animation-duration:10s;animation-delay:-2s" fill="#b57bff"/>
    <circle class="zerre" cx="880" cy="370" r="1.3" style="animation-duration:9.5s;animation-delay:-5s" fill="#b57bff"/>
    <circle class="zerre" cx="1010" cy="370" r="1.7" style="animation-duration:12.5s;animation-delay:-9s" fill="#b57bff"/>
    <circle class="zerre" cx="1150" cy="370" r="1.2" style="animation-duration:10.5s;animation-delay:-4s"/>
  </g>

  <!-- sol: kimlik -->
  <g class="gir" style="animation-delay:.05s">
    <rect x="64" y="70" width="176" height="30" rx="15" fill="#00d4ff" fill-opacity=".08" stroke="#00d4ff" stroke-opacity=".45"/>
    <circle cx="84" cy="85" r="4" fill="#00d4ff" filter="url(#parilti)"/>
    <text class="mono" x="98" y="90" font-size="14" fill="#9fe9ff" letter-spacing=".5">~/enskygr234</text>
  </g>
  <g class="gir" style="animation-delay:.2s">
    <text class="sans" x="62" y="168" font-size="70" font-weight="800" fill="url(#baslik)" textLength="560" lengthAdjust="spacingAndGlyphs" filter="url(#parilti)">Winterdeveloper</text>
  </g>
  <g class="gir" style="animation-delay:.38s">
    <text class="sans" x="65" y="212" font-size="22" fill="#c4d3ec" letter-spacing=".3">Oyunlar <tspan fill="#00d4ff">/</tspan> Android uygulamaları <tspan fill="#a855f7">/</tspan> Windows araçları <tspan fill="#00d4ff">/</tspan> Web</text>
  </g>
  <g class="gir" style="animation-delay:.55s">
    <rect x="65" y="232" width="64" height="3" rx="1.5" fill="#00d4ff"/>
    <rect x="135" y="232" width="22" height="3" rx="1.5" fill="#a855f7"/>
  </g>

  <!-- sağ: kod paneli -->
  <g class="gir" style="animation-delay:.45s">
    <rect x="770" y="58" width="370" height="178" rx="14" fill="url(#panel)" stroke="url(#panelKenar)" stroke-width="1.2"/>
    <path d="M770 86 H1140" stroke="#1d2a4d"/>
    <circle cx="790" cy="72" r="5" fill="#ff5f87" opacity=".85"/>
    <circle cx="808" cy="72" r="5" fill="#ffd166" opacity=".85"/>
    <circle cx="826" cy="72" r="5" fill="#3ee0a1" opacity=".85"/>
    <text class="mono" x="1122" y="76" font-size="11.5" fill="#5d6b8f" text-anchor="end">profil.js</text>
    <g class="mono" font-size="14.5">
      <text x="792" y="114"><tspan fill="#b57bff">const</tspan><tspan fill="#e6edf7"> dev = {</tspan></text>
      <text x="812" y="138"><tspan fill="#7dd3fc">ad</tspan><tspan fill="#e6edf7">: </tspan><tspan fill="#a5f3c4">"Winterdeveloper"</tspan><tspan fill="#e6edf7">,</tspan></text>
      <text x="812" y="162"><tspan fill="#7dd3fc">yapar</tspan><tspan fill="#e6edf7">: [</tspan><tspan fill="#a5f3c4">"oyun"</tspan><tspan fill="#e6edf7">, </tspan><tspan fill="#a5f3c4">"apk"</tspan><tspan fill="#e6edf7">, </tspan><tspan fill="#a5f3c4">"exe"</tspan><tspan fill="#e6edf7">],</tspan></text>
      <text x="812" y="186"><tspan fill="#7dd3fc">ilham</tspan><tspan fill="#e6edf7">: </tspan><tspan fill="#a5f3c4">"Türk masalları"</tspan><tspan fill="#e6edf7">,</tspan></text>
      <text x="792" y="212"><tspan fill="#e6edf7">};</tspan></text>
      <rect class="imlec" x="815" y="200" width="9" height="16" fill="#00d4ff"/>
    </g>
  </g>

  <!-- tarama ışığı -->
  <rect class="tara" x="0" y="0" width="260" height="380" fill="url(#tarama)"/>

  <!-- çerçeve -->
  <rect x=".75" y=".75" width="1198.5" height="378.5" rx="18" fill="none" stroke="url(#panelKenar)" stroke-opacity=".55" stroke-width="1.5"/>
</g>
</svg>
