<g class="gir" style="animation-delay:0.08s"><rect x="282" y="80" width="236" height="78" rx="12" fill="#0b1328" stroke="#18244a"/><rect x="282" y="98" width="3" height="42" rx="1.5" fill="#a855f7"/><text class="dg" x="302" y="120" fill="#a855f7">12</text><text class="et" x="302" y="142">Kullandığım dil</text></g>
<g class="gir" style="animation-delay:0.16s"><rect x="532" y="80" width="236" height="78" rx="12" fill="#0b1328" stroke="#18244a"/><rect x="532" y="98" width="3" height="42" rx="1.5" fill="#00d4ff"/><text class="dg" x="552" y="120" fill="#00d4ff">25</text><text class="et" x="552" y="142">Yayın</text></g>
<g class="gir" style="animation-delay:0.24s"><rect x="32" y="172" width="236" height="78" rx="12" fill="#0b1328" stroke="#18244a"/><rect x="32" y="190" width="3" height="42" rx="1.5" fill="#a855f7"/><text class="dg" x="52" y="212" fill="#a855f7">265</text><text class="et" x="52" y="234">Son 1 yılda katkı</text></g>
<g class="gir" style="animation-delay:0.32s"><rect x="282" y="172" width="236" height="78" rx="12" fill="#0b1328" stroke="#18244a"/><rect x="282" y="190" width="3" height="42" rx="1.5" fill="#00d4ff"/><text class="dg" x="302" y="212" fill="#00d4ff">210</text><text class="et" x="302" y="234">Son 1 yılda commit</text></g>
<g class="gir" style="animation-delay:0.40s"><rect x="532" y="172" width="236" height="78" rx="12" fill="#0b1328" stroke="#18244a"/><rect x="532" y="190" width="3" height="42" rx="1.5" fill="#a855f7"/><text class="dg" x="552" y="212" fill="#a855f7">MIT</text><text class="et" x="552" y="234">Lisans</text></g>
