<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 262" width="800" height="262" role="img" aria-label="Enskygr234 GitHub istatistikleri">
<defs>
<linearGradient id="z" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070c1c"/><stop offset="1" stop-color="#03050c"/></linearGradient>
<linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="kn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff" stop-opacity=".6"/><stop offset=".5" stop-color="#18244a"/><stop offset="1" stop-color="#a855f7" stop-opacity=".6"/></linearGradient>
<radialGradient id="isik" cx="0" cy="0" r="1"><stop offset="0" stop-color="#00d4ff" stop-opacity=".22"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="isik2" cx="1" cy="1" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".20"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
<clipPath id="k"><rect width="800" height="262" rx="16"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Inter,-apple-system,system-ui,Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','Fira Code',Consolas,'SF Mono',Menlo,monospace}
.bs{font-size:19px;font-weight:700;fill:#e6edf7}
.alt{font-size:12.5px;fill:#7d8aa6}
.dg{font-size:31px;font-weight:800}
.et{font-size:14px;fill:#7d8aa6}
.dl{font-size:15px;fill:#e6edf7;font-weight:600}
.yz{font-size:14px;fill:#7d8aa6;font-variant-numeric:tabular-nums}
.gir{opacity:0;animation:g .8s ease-out forwards}
@keyframes g{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:b 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes b{to{transform:scaleX(1)}}
.nb{animation:nb 2.4s ease-in-out infinite}
@keyframes nb{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.gir,.bar,.nb{animation:none;opacity:1;transform:none}}
</style>
<g clip-path="url(#k)"><rect width="800" height="262" fill="url(#z)"/><rect width="800" height="262" fill="url(#isik)"/><rect width="800" height="262" fill="url(#isik2)"/>
<rect x=".75" y=".75" width="798.5" height="260.5" rx="16" fill="none" stroke="url(#kn)" stroke-width="1.5"/>
<circle class="nb" cx="38" cy="44" r="5" fill="#00d4ff"/>
<text class="bs" x="54" y="51">Genel Bakış</text>
<text class="alt m" x="768" y="50" text-anchor="end">her gece güncellenir</text>
