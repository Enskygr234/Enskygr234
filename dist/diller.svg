<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" width="800" height="332" role="img" aria-label="En çok kullandığım diller: JavaScript %89.1, HTML %4.6, CSS %3.6, Python %1.1, Kotlin %0.7, Java %0.5">
<defs>
<linearGradient id="z" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070c1c"/><stop offset="1" stop-color="#03050c"/></linearGradient>
<linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<linearGradient id="kn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d4ff" stop-opacity=".6"/><stop offset=".5" stop-color="#18244a"/><stop offset="1" stop-color="#a855f7" stop-opacity=".6"/></linearGradient>
<radialGradient id="isik" cx="0" cy="0" r="1"><stop offset="0" stop-color="#00d4ff" stop-opacity=".22"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="isik2" cx="1" cy="1" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".20"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
